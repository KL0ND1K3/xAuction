# Тексты: messages.yml, вид меню: gui.yml

admin-permission: xauction.admin

# auto / vault / rpg
economy:
  provider: auto

duration-seconds: 600
bid-lock-seconds: 10
between-auctions-seconds: 5
first-delay-seconds: 10
min-increment: 1
allow-decimal: true

# 0 — без подтверждения
confirm-percent: 50
confirm-seconds: 15

skip-if-empty: true
history-size: 10

sounds:
  open: UI_BUTTON_CLICK
  click: UI_BUTTON_CLICK
  bid: BLOCK_NOTE_BLOCK_PLING
  win: ENTITY_PLAYER_LEVELUP
  error: ENTITY_VILLAGER_NO
  start: ENTITY_EXPERIENCE_ORB_PICKUP
  rare: UI_TOAST_CHALLENGE_COMPLETE

bossbar: true
actionbar: false
titles: true
broadcast-bids: true
drop-if-full: true

# weight — шанс выпадения
