animate-gradient-ticks: 10
size: 45

border-materials:
  - PURPLE_STAINED_GLASS_PANE
  - MAGENTA_STAINED_GLASS_PANE
  - PINK_STAINED_GLASS_PANE

border-name: "<!italic><dark_gray> </dark_gray>"
border-lore: []

titles:
  auction:
    - "<!italic><gradient:#F3E5F5:#AB47BC><bold>Торги</bold></gradient>"
  history:
    - "<!italic><gradient:#F3E5F5:#AB47BC><bold>История</bold></gradient>"
  confirm:
    - "<!italic><gradient:#CE93D8:#AB47BC><bold>Подтверждение</bold></gradient>"
  anvil: "<gradient:#CE93D8:#AB47BC><bold>Ставка</bold></gradient>"

lot-slot: 22
info-slot: 20
timer-slot: 24
balance-slot: 30
history-slot: 31
help-slot: 32
history-back-slot: 40
history-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21]
confirm-yes-slot: 11
confirm-item-slot: 13
confirm-no-slot: 15

items:
  info:
    material: GOLD_INGOT
    name: "<!italic><gradient:#F3E5F5:#AB47BC><bold>Ставка</bold></gradient>"
    lore:
      - "<!italic><white>{item}</white>"
      - "<!italic><white>{price}</white>"
      - "<!italic><white>{player}</white>"
  timer:
    material: CLOCK
    name: "<!italic><gradient:#CE93D8:#9C27B0><bold>Время</bold></gradient>"
    lore:
      - "<!italic><white>Лот: {time}</white>"
      - "<!italic><white>Победа: {lock}</white>"
  balance:
    material: SUNFLOWER
    name: "<!italic><gradient:#E1BEE7:#AB47BC><bold>Баланс</bold></gradient>"
    lore:
      - "<!italic><white>{balance}</white>"
      - "<!italic><gray>Мин. {min}</gray>"
  help:
    material: BOOK
    name: "<!italic><gradient:#F3E5F5:#CE93D8><bold>Ставки</bold></gradient>"
    lore:
      - "<!italic><white>Кликни лот и введи сумму выше текущей.</white>"
      - "<!italic><gray>/auction bid <сумма></gray>"
  history:
    material: WRITTEN_BOOK
    name: "<!italic><gradient:#CE93D8:#AB47BC><bold>История</bold></gradient>"
    lore:
      - "<!italic><gray>Последние лоты</gray>"
  history-lot:
    name: "<!italic><gradient:#F3E5F5:#AB47BC><bold>{rare_label}{item}</bold></gradient>"
    lore:
      - "<!italic><white>{winner}</white>"
      - "<!italic><white>{price}</white>"
      - "<!italic><gray>{time}</gray>"
  history-empty:
    name: "<!italic><dark_gray>—</dark_gray>"
    lore: []
  back:
    material: ARROW
    name: "<!italic><white>Назад</white>"
    lore: []
  confirm-yes:
    material: EMERALD_BLOCK
    name: "<!italic><green><bold>Да</bold></green>"
    lore:
      - "<!italic><white>{price}</white>"
  confirm-item:
    material: GOLD_INGOT
    name: "<!italic><gradient:#CE93D8:#AB47BC><bold>{price}</bold></gradient>"
    lore:
      - "<!italic><white>Вы уверены что ставите {price}?</white>"
  confirm-no:
    material: REDSTONE_BLOCK
    name: "<!italic><red><bold>Нет</bold></red>"
    lore: []
  lot-name: "<!italic><gradient:#F3E5F5:#AB47BC><bold>{item}</bold></gradient>"
  lot-rare-name: "<!italic><gradient:#FFD54F:#AB47BC><bold>Редкий {item}</bold></gradient>"
  lot-lore:
    - "{rare_line}"
    - "<!italic><white>{amount} шт.</white>"
    - "<!italic><white>{price}</white>"
    - "<!italic><white>{player}</white>"

anvil-item-name: "<!italic><white>Мин. {price}</white>"
anvil-result-name: "<!italic><green>Готово</green>"
