prefix: "<gradient:#F3E5F5:#CE93D8:#AB47BC><bold>xAuction</bold></gradient> <dark_gray>»</dark_gray> "

start:
  - "<gradient:#F3E5F5:#AB47BC><bold>Торги:</bold></gradient> <white>{item}</white>"
  - "<white>Старт: <light_purple>{price}</light_purple>  <click:run_command:'/auction'><hover:show_text:'<white>Открыть меню</white>'><gradient:#CE93D8:#9C27B0><bold>[Участвовать]</bold></gradient></hover></click></white>"

start-rare:
  - "<gradient:#FFD54F:#AB47BC><bold>Редкий торг:</bold></gradient> <white>{item}</white>"
  - "<white>Старт: <light_purple>{price}</light_purple>  <click:run_command:'/auction'><hover:show_text:'<white>Открыть меню</white>'><gradient:#FFD54F:#AB47BC><bold>[Участвовать]</bold></gradient></hover></click></white>"

title-start: "<gradient:#F3E5F5:#AB47BC><bold>Торги</bold></gradient>"
subtitle-start: "<white>{item}</white> <gray>от {price}</gray>"
title-start-rare: "<gradient:#FFD54F:#AB47BC><bold>Редкий торг</bold></gradient>"
subtitle-start-rare: "<white>{item}</white> <gray>от {price}</gray>"

bid-broadcast: "<light_purple>{player}</light_purple> <white>ставит</white> <light_purple>{price}</light_purple> <gray>на {item}</gray>"
bid-ok: "<white>Ставка принята: <light_purple>{price}</light_purple>.</white> <gray>{lock} сек. без перебития — победа.</gray>"
outbid: "<white>Ставку перебили. Возврат: <light_purple>{price}</light_purple>.</white>"
win-broadcast: "<gradient:#F3E5F5:#AB47BC><bold>{player}</bold></gradient> <white>выиграл {item} за {price}</white>"
win-self: "<white>Ты выиграл {item} за <light_purple>{price}</light_purple>.</white>"
expire: "<gray>Торг на {item} без ставок.</gray>"
next-soon: "<gray>Следующий лот через {time}.</gray>"

no-auction: "<red>Сейчас торга нет.</red>"
waiting-lot: "<gray>Лот ещё не выставлен.</gray>"
confirm-ask: "<white>Вы уверены что ставите <light_purple>{price}</light_purple>?</white>"
confirm-buttons: "<click:run_command:'/auction yes'><green><bold>[Да]</bold></green></click>  <click:run_command:'/auction no'><red><bold>[Нет]</bold></red></click>"
confirm-timeout: "<red>Время подтверждения вышло.</red>"
confirm-none: "<gray>Нечего подтверждать.</gray>"
no-economy: "<red>Экономика не найдена.</red>"
not-enough: "<red>Нужно {price}. У тебя {balance}.</red>"
bid-low: "<red>Мало. Минимум {price}.</red>"
bid-invalid: "<red>Нужно число больше {price}. Отмена: отмена</red>"
bid-prompt: "<white>Введи ставку в наковальне или в чат. Минимум {price}.</white>"
bid-cancel: "<gray>Ставка отменена.</gray>"
same-bid: "<red>Это уже твоя ставка.</red>"
inventory-full: "<yellow>Инвентарь полный — предмет на земле или выдастся при входе.</yellow>"
pending-give: "<white>Выдан выигрыш: {item}</white>"
players-only: "<red>Только для игрока.</red>"
no-permission: "<red>Нет прав.</red>"
unknown-subcommand: "<red>Неизвестная подкоманда.</red> <gray>/auction</gray>"
reloaded: "<green>Конфиг перечитан.</green>"
forced-next: "<green>Лот закрыт, следующий запущен.</green>"
usage-bid: "<white>/auction bid <сумма></white>"

actionbar-lock: "<light_purple>{item}</light_purple> <gray>|</gray> <white>{price}</white> <gray>|</gray> {player} <gray>|</gray> <gold>{lock}с</gold>"
actionbar-wait: "<light_purple>{item}</light_purple> <gray>|</gray> <white>от {price}</white> <gray>|</gray> {time}"
bossbar-lock: "<gradient:#F3E5F5:#AB47BC><bold>{rare_label}Торги</bold></gradient> <white>{item}</white> <gray>|</gray> {price} <gray>|</gray> {lock}с"
bossbar-wait: "<gradient:#F3E5F5:#AB47BC><bold>{rare_label}Торги</bold></gradient> <white>{item}</white> <gray>|</gray> от {price} <gray>|</gray> {time}"
